<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CS2 道具速查</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #1a1a1a;
            color: #f0f0f0;
            min-height: 100vh;
        }
        .navbar {
            background: #2d2d2d;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 2px solid #444;
            flex-wrap: wrap;
        }
        .navbar a, .navbar span {
            color: #ccc;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
        }
        .navbar a:hover {
            color: #fff;
            text-decoration: underline;
        }
        .navbar .separator {
            color: #666;
            font-weight: normal;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        .card {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: 0.2s;
        }
        .card:hover { background: #3a3a3a; border-color: #666; }
        .card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 8px;
        }
        .btn {
            background: #4a6fa5;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
            font-size: 14px;
        }
        .btn.danger { background: #a54a4a; }
        .btn.small { padding: 4px 10px; font-size: 12px; }
        input, textarea, select {
            background: #333;
            border: 1px solid #555;
            color: white;
            padding: 6px 10px;
            border-radius: 4px;
            width: 100%;
            margin: 4px 0;
        }
        textarea { resize: vertical; min-height: 60px; }
        .admin-section {
            background: #252525;
            border: 1px solid #555;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
        }
        .flex-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- 导航栏 - 已支持返回上一级 -->
        <div class="navbar">
            <!-- 首页状态 -->
            <template v-if="view === 'home'">
                <span>🏠 首页</span>
            </template>

            <!-- 地图内状态 -->
            <template v-else-if="view === 'map'">
                <a href="#" @click.prevent="navTo('home')">🏠 首页</a>
                <span class="separator"> &gt; </span>
                <span>{{ currentMap.name }}</span>
            </template>

            <!-- 道具位置内状态 -->
            <template v-else-if="view === 'location'">
                <a href="#" @click.prevent="navTo('home')">🏠 首页</a>
                <span class="separator"> &gt; </span>
                <a href="#" @click.prevent="openMap(currentMap)">{{ currentMap.name }}</a>
                <span class="separator"> &gt; </span>
                <span>{{ currentLocation.name }}</span>
            </template>

            <!-- 管理界面状态 -->
            <template v-else-if="view === 'admin'">
                <a href="#" @click.prevent="navTo('home')">🏠 返回首页</a>
            </template>

            <!-- 右侧管理入口 -->
            <span style="flex:1"></span>
            <a href="?admin" @click.prevent="navTo('admin')" style="font-size:14px;opacity:0.7;">⚙️ 管理</a>
        </div>

        <div class="container">
            <!-- 首页：地图选择 -->
            <div v-if="view === 'home'">
                <h2 style="margin-bottom:15px;">选择地图</h2>
                <div class="grid">
                    <div class="card" v-for="map in maps" :key="map.id" @click="openMap(map)">
                        <img :src="map.image || 'https://via.placeholder.com/300x150?text='+map.name" alt="">
                        <strong>{{ map.name }}</strong>
                    </div>
                </div>
                <p v-if="maps.length === 0" style="color:#aaa;">暂无地图数据，请先通过管理界面添加。</p>
            </div>

            <!-- 一级：道具位置列表 -->
            <div v-if="view === 'map' && currentMap">
                <h2>{{ currentMap.name }} - 道具位置</h2>
                <div class="grid" style="margin-top:15px;">
                    <div class="card" v-for="loc in currentMap.locations" :key="loc.id" @click="openLocation(loc)">
                        <img :src="loc.image || 'https://via.placeholder.com/300x150?text='+loc.name" alt="">
                        <strong>{{ loc.name }}</strong>
                        <p style="font-size:12px;color:#aaa;">{{ loc.items.length }} 个道具</p>
                    </div>
                </div>
            </div>

            <!-- 二级：具体道具投法 -->
            <div v-if="view === 'location' && currentLocation">
                <h2>{{ currentMap.name }} - {{ currentLocation.name }}</h2>
                <div v-for="(item, idx) in currentLocation.items" :key="item.id" style="background:#2a2a2a;padding:15px;margin:10px 0;border-radius:8px;">
                    <h3>{{ item.name }} <span style="font-size:14px;color:#aaa;">[{{ item.type }}]</span></h3>
                    <p style="white-space:pre-line;">{{ item.description }}</p>
                    <div class="flex-row" style="margin-top:10px;">
                        <img v-for="img in item.images" :key="img" :src="img" style="max-width:200px;max-height:150px;border-radius:4px;" />
                    </div>
                    <p v-if="item.video" style="margin-top:8px;">📹 <a :href="item.video" target="_blank" style="color:#6ab0ff;">视频教程</a></p>
                </div>
            </div>

            <!-- 管理界面 -->
            <div v-if="view === 'admin'">
                <h2>🔧 数据管理器</h2>
                <div class="admin-section">
                    <button class="btn" @click="exportData">📥 导出 JSON</button>
                    <button class="btn" @click="importDataPrompt">📤 导入 JSON</button>
                    <button class="btn danger" @click="resetData">⚠️ 重置为示例数据</button>
                </div>

                <div class="admin-section" v-for="(map, mi) in maps" :key="map.id">
                    <h3>🗺️ 地图 {{ mi+1 }}</h3>
                    <input v-model="map.name" placeholder="地图名称" />
                    <input v-model="map.image" placeholder="图片URL" />
                    <div class="flex-row">
                        <button class="btn small" @click="addLocation(map)">+ 添加位置</button>
                        <button class="btn small danger" @click="maps.splice(mi,1)">删除地图</button>
                    </div>

                    <div v-for="(loc, li) in map.locations" :key="loc.id" style="margin-left:20px;border-left:2px solid #555;padding-left:10px;margin-top:10px;">
                        <h4>📍 位置</h4>
                        <input v-model="loc.name" placeholder="位置名称" />
                        <input v-model="loc.image" placeholder="图片URL" />
                        <div class="flex-row">
                            <button class="btn small" @click="addItem(loc)">+ 添加道具</button>
                            <button class="btn small danger" @click="map.locations.splice(li,1)">删除位置</button>
                        </div>

                        <div v-for="(item, ii) in loc.items" :key="item.id" style="margin-left:20px;border-left:1px solid #666;padding:5px 0 5px 10px;margin-top:5px;">
                            <strong>🎯 道具</strong>
                            <input v-model="item.name" placeholder="道具名称" />
                            <input v-model="item.type" placeholder="类型 (烟雾弹/闪光弹...)" />
                            <textarea v-model="item.description" placeholder="投掷说明"></textarea>
                            <div>图片 URLs (逗号分隔)</div>
                            <input v-model="item.imagesStr" @change="updateItemImages(item)" placeholder="http://..." />
                            <input v-model="item.video" placeholder="视频链接 (可选)" />
                            <button class="btn small danger" @click="loc.items.splice(ii,1)">删除道具</button>
                        </div>
                    </div>
                </div>

                <button class="btn" @click="addMap">➕ 添加新地图</button>
            </div>
        </div>
    </div>

    <script>
        const defaultData = {
            maps: [
                {
                    id: "dust2",
                    name: "炙热沙城 II",
                    image: "https://via.placeholder.com/300x150?text=Dust2",
                    locations: [
                        {
                            id: "a_ramp",
                            name: "A斜坡",
                            image: "https://via.placeholder.com/300x150?text=A+Ramp",
                            items: [
                                {
                                    id: "smoke1",
                                    name: "CT出生点封A斜坡烟",
                                    type: "烟雾弹",
                                    description: "站在垃圾桶旁，准星对准屋檐缺口，直接投掷。",
                                    images: ["https://via.placeholder.com/200x150?text=瞄准点"],
                                    video: ""
                                }
                            ]
                        }
                    ]
                }
            ]
        };

        const app = Vue.createApp({
            data() {
                return {
                    maps: [],
                    view: 'home',
                    currentMap: null,
                    currentLocation: null
                }
            },
            created() {
                const saved = localStorage.getItem('cs2_utility_data');
                if (saved) {
                    try { this.maps = JSON.parse(saved).maps || []; }
                    catch (e) { this.maps = defaultData.maps; }
                } else {
                    this.maps = defaultData.maps;
                }
                const params = new URLSearchParams(window.location.search);
                if (params.has('admin')) this.view = 'admin';
            },
            watch: {
                maps: {
                    deep: true,
                    handler() { this.saveToLocal(); }
                }
            },
            methods: {
                saveToLocal() {
                    localStorage.setItem('cs2_utility_data', JSON.stringify({ maps: this.maps }));
                },
                navTo(view) {
                    this.view = view;
                    if (view !== 'map') this.currentMap = null;
                    if (view !== 'location') this.currentLocation = null;
                    const url = new URL(window.location);
                    view === 'admin' ? url.searchParams.set('admin', '') : url.searchParams.delete('admin');
                    window.history.replaceState({}, '', url);
                },
                openMap(map) {
                    this.currentMap = map;
                    this.currentLocation = null;
                    this.view = 'map';
                },
                openLocation(loc) {
                    this.currentLocation = loc;
                    this.view = 'location';
                },
                addMap() {
                    this.maps.push({ id: Date.now().toString(), name: '新地图', image: '', locations: [] });
                },
                addLocation(map) {
                    map.locations.push({ id: Date.now().toString(), name: '新位置', image: '', items: [] });
                },
                addItem(location) {
                    location.items.push({
                        id: Date.now().toString(),
                        name: '新道具',
                        type: '',
                        description: '',
                        images: [],
                        imagesStr: '',
                        video: ''
                    });
                },
                updateItemImages(item) {
                    item.images = item.imagesStr.split(',').map(s => s.trim()).filter(s => s);
                },
                exportData() {
                    const blob = new Blob([JSON.stringify({ maps: this.maps }, null, 2)], { type: 'application/json' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = 'cs2_data_backup.json';
                    a.click();
                },
                importDataPrompt() {
                    const input = document.createElement('input');
                    input.type = 'file';
                    input.accept = '.json';
                    input.onchange = e => {
                        const file = e.target.files[0];
                        const reader = new FileReader();
                        reader.onload = event => {
                            try {
                                const data = JSON.parse(event.target.result);
                                if (data.maps && Array.isArray(data.maps)) {
                                    this.maps = data.maps;
                                    alert('导入成功！');
                                } else {
                                    alert('数据格式错误，需要包含 maps 数组。');
                                }
                            } catch (err) { alert('JSON 解析失败'); }
                        };
                        reader.readAsText(file);
                    };
                    input.click();
                },
                resetData() {
                    if (confirm('确定重置为示例数据吗？当前数据将丢失。')) {
                        this.maps = JSON.parse(JSON.stringify(defaultData.maps));
                    }
                }
            }
        });

        function ensureImagesStr(maps) {
            maps.forEach(map => {
                map.locations.forEach(loc => {
                    loc.items.forEach(item => {
                        if (!Object.prototype.hasOwnProperty.call(item, 'imagesStr')) {
                            item.imagesStr = (item.images || []).join(', ');
                        }
                    });
                });
            });
        }
        app.mount('#app');
        ensureImagesStr(app._instance.data.maps);
    </script>
</body>
</html>
